name: AI News Daily

on:
  schedule:
    # 每天早上 7:00 北京时间 (UTC 23:00)
    - cron: '0 23 * * *'
  workflow_dispatch:

jobs:
  ai-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install feedparser requests

      - name: AI News Daily
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
        run: python scripts/fetch_and_push.py
